[pytest]
pythonpath = .
testpaths = tests
addopts = --ignore=tests/shape -ra --strict-markers --maxprocesses=8
timeout = 120
timeout_method = thread
markers =
    smoke: tiny contract tests always run by the pr gate profile (USR-377 S5)
    offline: deterministic test that must not use network, credentials, or accelerators
    live: optional test that may use a real provider or local model
    gpu: optional test that requires CUDA or another accelerator
    serial: test that cannot run under pytest-xdist parallel workers (shared state, fixed ports, real repo mutation, or a tight latency budget); collected into its own serial step
    postgres_integration: optional test against a real disposable PostgreSQL; skipped unless DARKFAC_TEST_POSTGRES_DSN is set (admin DSN of a throwaway server, never production)
