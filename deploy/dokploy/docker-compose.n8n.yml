# ==============================================================================
# Dark Factory: n8n Community Self-Hosted Production Compose (HF-14 Post-Setup)
# Governed by HYBRID_WORKFLOW_PLAN_2026-09-08 (Sections 5, 8, 10)
# Target Host: Hetzner CX23 (darkfac-vps-primary / dokploy.ggcampos.com)
# Domain: https://n8n.ggcampos.com
# ==============================================================================
version: "3.8"

services:
  n8n-postgres:
    image: postgres:16-alpine
    container_name: darkfac-n8n-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:-darkfac_n8n_secure_pass}
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
    volumes:
      - n8n-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n} -d ${N8N_DB_NAME:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  n8n:
    image: n8nio/n8n:latest
    container_name: darkfac-n8n-app
    restart: unless-stopped
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_HOST=${N8N_HOST:-n8n.ggcampos.com}
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-https://n8n.ggcampos.com/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-CHANGE_ME_N8N_ENCRYPTION_KEY_SECRET}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:-darkfac_n8n_secure_pass}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336 # 14 days retention
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_METRICS=true
    volumes:
      - n8n-app-data:/home/node/.n8n
    depends_on:
      n8n-postgres:
        condition: service_healthy
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.ggcampos.com`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls.certresolver=letsencrypt"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

volumes:
  n8n-postgres-data:
    name: darkfac-n8n-postgres-data
  n8n-app-data:
    name: darkfac-n8n-app-data

networks:
  dokploy-network:
    external: true
