# ==============================================================================
# Dark Factory Cloud Coordinator & Isolated Worker - Dokploy PaaS Production Compose
# Ticket: HF-03-01 | ADR-HF-001 / INFRA-05 / INFRA-06 / INFRA-07
# Target Host: Hetzner CX23 (darkfac-vps-primary / dokploy.ggcampos.com)
# ==============================================================================

services:
  darkfac-coordinator:
    build:
      context: https://github.com/GCamposGit/DarkFactory.git#main
      dockerfile: deploy/dokploy/Dockerfile.cloud
    image: ghcr.io/gcamposgit/darkfac-cloud:latest
    container_name: darkfac-coordinator
    restart: unless-stopped
    stop_grace_period: 35s
    command: ["python", "-m", "core.orchestrator.cloud_coordinator"]
    environment:
      - DARKFAC_ROLE=coordinator
      - DARKFAC_HF02_DATABASE_URL=${DARKFAC_HF02_DATABASE_URL}
      - DARKFAC_MAX_CONCURRENT_SLOTS=${DARKFAC_MAX_CONCURRENT_SLOTS:-2}
      - DARKFAC_COORDINATOR_PORT=8001
      - DARKFAC_COORDINATOR_API_TOKEN=${DARKFAC_COORDINATOR_API_TOKEN:-}
      - DARKFAC_INTAKE_ENABLED=${DARKFAC_INTAKE_ENABLED:-false}
      - DARKFAC_ALLOWED_PROJECT_ID=darkfac
      - DATA_DIR=/app/data
      - FACTORY_DIR=/app/.factory
      - DARKFAC_DEMANDS_PATH=/app/.factory/demands/demands.json
      - DARKFAC_DEMANDS_SEED_PATH=/app/.factory_seed/demands/demands.json
      - DARKFAC_DEMANDS_SHARED_VOLUME=darkfac-demands-v1
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # INFRA-08: Cloudflare R2 & On-Premise Backups
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-darkfac-backups}
      - DARKFAC_BACKUP_ENCRYPTION_KEY=${DARKFAC_BACKUP_ENCRYPTION_KEY:-}
      - DARKFAC_ONPREM_BACKUP_DIR=${DARKFAC_ONPREM_BACKUP_DIR:-}
    healthcheck:
      test: ["CMD", "python", "-m", "core.orchestrator.cloud_coordinator", "--status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - darkfac-artifacts:/app/.factory/artifacts
      - darkfac-test-logs:/app/.factory/test_logs
      - darkfac-demands:/app/.factory/demands
    ports:
      - "127.0.0.1:8001:8001"
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.2"
          memory: 512M

  darkfac-worker:
    build:
      context: https://github.com/GCamposGit/DarkFactory.git#main
      dockerfile: deploy/dokploy/Dockerfile.cloud
    image: ghcr.io/gcamposgit/darkfac-cloud:latest
    container_name: darkfac-worker-1
    restart: unless-stopped
    stop_grace_period: 35s
    # PID 1 reaper (tini): killed grandchildren of agent subprocesses are reparented to PID 1; without an
    # init they stay zombies (psutil.pid_exists stays true) for the life of the container.
    init: true
    command: ["python", "-m", "core.orchestrator.cloud_worker"]
    environment:
      - DARKFAC_ROLE=worker
      - DARKFAC_WORKER_ID=${DARKFAC_WORKER_ID:-cloud-worker-1}
      # HF-27-09 topology: VPS caps/priority. Desktop and Notebook run the
      # same image/command on-prem via scripts/start_onprem_worker.ps1 with
      # their own DARKFAC_WORKER_CAPS/DARKFAC_WORKER_PRIORITY instead.
      - DARKFAC_WORKER_CAPS=${DARKFAC_WORKER_CAPS:-git,gh,node,python,harness:claude,harness:codex}
      - DARKFAC_WORKER_PRIORITY=${DARKFAC_WORKER_PRIORITY:-primary}
      # Codex's own Linux sandbox (landlock/seccomp) is unavailable in an unprivileged container, so
      # `codex exec --sandbox ...` fails here; the container is the isolation boundary instead.
      # `bypass` = --dangerously-bypass-approvals-and-sandbox (codex-cli 0.159.3). Desktop/Notebook leave
      # this unset (auto) and keep Codex's sandbox.
      - DARKFAC_CODEX_SANDBOX_MODE=${DARKFAC_CODEX_SANDBOX_MODE:-bypass}
      # Bootstrap for a worker that has no quota reading for a subscription harness yet (Codex before its
      # first call here): such a harness is elected only after every known-healthy one and before
      # OpenRouter; known-critical (<=15%) stays excluded. Worker service only; unset = fail-closed.
      - DARKFAC_ROUTING_UNKNOWN_QUOTA=${DARKFAC_ROUTING_UNKNOWN_QUOTA:-last_resort}
      - DARKFAC_WORKSPACES=/workspaces
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      # HF-27-10 canary trace (B.4): core.line.workspace only reads
      # GITHUB_TOKEN (not the GITHUB_PAT declared in env.cloud.example) to
      # authenticate HTTPS clone/push for a private repo -- without it, any
      # private project (darkfac-canary included) fails workspace checkout.
      # Pre-existing gap for every project, fixed here since this is the
      # container that actually runs `integration`/checkout.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # HF-27-10 canary trace (B.4): core.orchestrator.deployment_adapter's
      # DokployDeploymentAdapter reads these for the real Dokploy API/webhook
      # call in build_deploy (core/line/stage_release.py::_target_config
      # falls back to them when a project's deploy.params has no api_url/
      # deploy_url of its own). Without at least one of DOKPLOY_API_URL or
      # DOKPLOY_DEPLOY_URL set, the adapter silently no-ops and reconcile()
      # never leaves IN_PROGRESS -- pre-existing gap for every project,
      # wired here (values are provisioned in the Dokploy vault, not here).
      - DOKPLOY_API_URL=${DOKPLOY_API_URL:-}
      - DOKPLOY_API_KEY=${DOKPLOY_API_KEY:-}
      - DOKPLOY_DEPLOY_URL=${DOKPLOY_DEPLOY_URL:-}
      - DARKFAC_HF02_DATABASE_URL=${DARKFAC_HF02_DATABASE_URL}
      - DARKFAC_MAX_CONCURRENT_SLOTS=${DARKFAC_MAX_CONCURRENT_SLOTS:-1}
      - DATA_DIR=/app/data
      - FACTORY_DIR=/app/.factory
      - DARKFAC_DEMANDS_PATH=/app/.factory/demands/demands.json
      - DARKFAC_DEMANDS_SEED_PATH=/app/.factory_seed/demands/demands.json
      - DARKFAC_DEMANDS_SHARED_VOLUME=darkfac-demands-v1
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - REMOTE_HARNESS_URLS=${REMOTE_HARNESS_URLS:-http://100.78.181.90:8080,http://100.81.84.124:8080}
      - REMOTE_HARNESS_URL=${REMOTE_HARNESS_URL:-http://100.78.181.90:8080}
      # Test offload for the official gate (`runner.py --quick`, used by the line's
      # clean-tree validation of the darkfac project via scripts/line_validate.py):
      # dispatched to the Desktop test worker over the tailnet, local fallback.
      - DARKFAC_TEST_WORKERS=${DARKFAC_TEST_WORKERS:-http://100.78.181.90:8080}
      - DARKFAC_WORKER_TOKEN=${DARKFAC_WORKER_TOKEN:-}
      - DARKFAC_REMOTE_BUSY_WAIT_SEC=${DARKFAC_REMOTE_BUSY_WAIT_SEC:-900}
      # HF-27-10 PR #37 review item 4: core.line.human's owner notifications
      # (core.notifications.service.NotificationService, role="owner") need
      # these to actually send -- pre-existing gap, this service is the one
      # that calls them (grill/human-in-the-loop blocks), so it gets fixed
      # here rather than left broken alongside the canary's own wiring.
      - TELEGRAM_OWNER_BOT_TOKEN=${TELEGRAM_OWNER_BOT_TOKEN:-}
      # Grill questions and their inline buttons are sent with the OPS bot (@darkfac_ops_bot) when this is
      # set (owner bot is the fallback); alerts stay on TELEGRAM_OWNER_BOT_TOKEN.
      - TELEGRAM_OPS_BOT_TOKEN=${TELEGRAM_OPS_BOT_TOKEN:-}
      - TELEGRAM_AUTHORIZED_USERS=${TELEGRAM_AUTHORIZED_USERS:-}
      - TELEGRAM_AUTHORIZED_CHATS=${TELEGRAM_AUTHORIZED_CHATS:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      # INFRA-08: Cloudflare R2 & On-Premise Backups
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-darkfac-backups}
      - DARKFAC_BACKUP_ENCRYPTION_KEY=${DARKFAC_BACKUP_ENCRYPTION_KEY:-}
      - DARKFAC_ONPREM_BACKUP_DIR=${DARKFAC_ONPREM_BACKUP_DIR:-}
    healthcheck:
      test: ["CMD", "python", "-m", "core.orchestrator.cloud_worker", "--status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - darkfac-artifacts:/app/.factory/artifacts
      - darkfac-test-logs:/app/.factory/test_logs
      - darkfac-demands:/app/.factory/demands
      - darkfac-codex-auth:/home/darkfac/.codex
      - darkfac-workspaces:/workspaces
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: "1.5"
          # CX23 (2 vCPU, 4 GB): 1 agent slot; 2 GB + coordinator 1.5 GB leaves
          # headroom for Dokploy/OS. Raise only after a VPS upgrade.
          memory: 2048M
        reservations:
          cpus: "0.2"
          memory: 256M

  # INFRA-08: Autonomous 3-tier backup & restore drill daemon (24h schedule).
  # Operates 100% autonomously: snapshots multi-tenant postgres + .factory metadata,
  # encrypts with AES-256-GCM, pushes to Cloudflare R2, mirrors to drive E:, executes
  # sandbox restore drill, prunes per asymmetric retention policy (7d R2 / 120d onprem),
  # and dispatches critical Telegram alerts on any failure.
  darkfac-backup-cron:
    build:
      context: https://github.com/GCamposGit/DarkFactory.git#main
      dockerfile: deploy/dokploy/Dockerfile.cloud
    image: ghcr.io/gcamposgit/darkfac-cloud:latest
    container_name: darkfac-backup-cron
    restart: unless-stopped
    command: ["python", "-m", "core.infra.backup_cron", "--daemon", "--interval-hours", "24"]
    environment:
      - DARKFAC_ROLE=backup
      - DARKFAC_HF02_DATABASE_URL=${DARKFAC_HF02_DATABASE_URL}
      - DATA_DIR=/app/data
      - FACTORY_DIR=/app/.factory
      - DARKFAC_DEMANDS_PATH=/app/.factory/demands/demands.json
      - DARKFAC_DEMANDS_SEED_PATH=/app/.factory_seed/demands/demands.json
      - DARKFAC_DEMANDS_SHARED_VOLUME=darkfac-demands-v1
      - R2_ENDPOINT_URL=${R2_ENDPOINT_URL:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-darkfac-backups}
      - DARKFAC_BACKUP_ENCRYPTION_KEY=${DARKFAC_BACKUP_ENCRYPTION_KEY:-}
      - DARKFAC_ONPREM_BACKUP_DIR=${DARKFAC_ONPREM_BACKUP_DIR:-}
      - TELEGRAM_OWNER_BOT_TOKEN=${TELEGRAM_OWNER_BOT_TOKEN:-}
      - TELEGRAM_AUTHORIZED_USERS=${TELEGRAM_AUTHORIZED_USERS:-}
      - TELEGRAM_AUTHORIZED_CHATS=${TELEGRAM_AUTHORIZED_CHATS:-}
    volumes:
      - darkfac-artifacts:/app/.factory/artifacts
      - darkfac-test-logs:/app/.factory/test_logs
      - darkfac-demands:/app/.factory/demands
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.05"
          memory: 64M

  # HF-27-10: daily E2E canary. Disabled by default -- only started with
  # `docker compose --profile canary up -d darkfac-canary` (or a Dokploy
  # "Cron Job" / scheduled deployment targeting this service), since it
  # needs the real darkfac-canary repo + Dokploy app to be bootstrapped
  # first (see docs/runbooks/canary.md). `restart: "no"` because this is a
  # one-shot job: run it on a cron schedule (see docs/runbooks/canary.md
  # section 5), not as a long-running service. It uses the SAME store the
  # coordinator/worker use (Postgres iff DARKFAC_HF02_DATABASE_URL is set,
  # via core.line.store_selection -- HF-27-10 PR #37 review item 2), so its
  # demand enters the real public intake the worker actually reads, and its
  # `.factory/reports/canary/` reports live on their own named volume so a
  # streak survives across one-shot container runs (review item 3).
  # HF-27-10 closeout: runs continuously (no `profiles` gate, no manual
  # cron needed) via `core.line.canary run --every-seconds`, which loops
  # in-process -- see docs/runbooks/canary.md section 5. Each iteration is
  # cheap (DB reads + at most one HTTP GET), so it polls every 15 minutes:
  # that is also the cadence of a same-day retry after a terminal failure.
  darkfac-canary:
    build:
      context: https://github.com/GCamposGit/DarkFactory.git#main
      dockerfile: deploy/dokploy/Dockerfile.cloud
    image: ghcr.io/gcamposgit/darkfac-cloud:latest
    container_name: darkfac-canary
    restart: unless-stopped
    command: ["python", "-m", "core.line.canary", "run", "--base-url", "${DARKFAC_CANARY_BASE_URL:-}", "--every-seconds", "900"]
    environment:
      - DARKFAC_ROLE=canary
      - DARKFAC_HF02_DATABASE_URL=${DARKFAC_HF02_DATABASE_URL}
      - DARKFAC_CANARY_BASE_URL=${DARKFAC_CANARY_BASE_URL:-}
      - DARKFAC_CANARY_REPORTS_DIR=/app/.factory/reports/canary
      # HF-27-10 review item 4b: dogfood wiring stays off unless explicitly
      # turned on here (or standalone via `python -m core.line.dogfood run`
      # on its own cron entry -- see docs/runbooks/canary.md section 5).
      - DARKFAC_DOGFOOD_ENABLED=${DARKFAC_DOGFOOD_ENABLED:-false}
      # Green canary days required before dogfood feeds the backlog (code default 7).
      - DARKFAC_DOGFOOD_MIN_STREAK=${DARKFAC_DOGFOOD_MIN_STREAK:-1}
      # Same-day retries after a terminal failure (attempt ids canary:<date>:a2, a3...).
      - DARKFAC_CANARY_MAX_ATTEMPTS_PER_DAY=${DARKFAC_CANARY_MAX_ATTEMPTS_PER_DAY:-4}
      - DATA_DIR=/app/data
      - FACTORY_DIR=/app/.factory
      - DARKFAC_DEMANDS_PATH=/app/.factory/demands/demands.json
      - DARKFAC_DEMANDS_SEED_PATH=/app/.factory_seed/demands/demands.json
      - DARKFAC_DEMANDS_SHARED_VOLUME=darkfac-demands-v1
      # Same notifier env the worker uses (review item 4) -- NotificationService
      # (role="owner") needs these to actually send the failure/weekly alerts.
      - TELEGRAM_OWNER_BOT_TOKEN=${TELEGRAM_OWNER_BOT_TOKEN:-}
      # Grill questions and their inline buttons are sent with the OPS bot (@darkfac_ops_bot) when this is
      # set (owner bot is the fallback); alerts stay on TELEGRAM_OWNER_BOT_TOKEN.
      - TELEGRAM_OPS_BOT_TOKEN=${TELEGRAM_OPS_BOT_TOKEN:-}
      - TELEGRAM_AUTHORIZED_USERS=${TELEGRAM_AUTHORIZED_USERS:-}
      - TELEGRAM_AUTHORIZED_CHATS=${TELEGRAM_AUTHORIZED_CHATS:-}
    volumes:
      - darkfac-artifacts:/app/.factory/artifacts
      - darkfac-test-logs:/app/.factory/test_logs
      - darkfac-demands:/app/.factory/demands
      - darkfac-canary-reports-v2:/app/.factory/reports/canary
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M

  # Line-autonomy unblock: expose the (separate Dokploy) Postgres service on the
  # Tailscale interface ONLY, so on-prem workers (Desktop/Notebook) can reach the
  # line's control store. Postgres itself is not published anywhere; this tiny
  # TCP forwarder joins dokploy-network (where the DB's internal hostname
  # resolves) and publishes its port bound to the VPS tailnet IP, never 0.0.0.0.
  # Isolation: nothing depends on this service and it has no healthcheck the
  # others wait on -- if the bind fails (e.g. tailscale down, IP not on the host)
  # only this container crash-loops; coordinator/worker/canary are unaffected.
  # See docs/runbooks/HF-27-09_topology.md section 2.
  darkfac-pg-tailnet:
    image: alpine/socat:1.8.0.3
    container_name: darkfac-pg-tailnet
    restart: unless-stopped
    command:
      - "-d"
      - "TCP-LISTEN:5432,fork,reuseaddr"
      - "TCP:${DARKFAC_PG_UPSTREAM:-darkfaccore-postgresprimary-aebh67:5432}"
    ports:
      - "${DARKFAC_TAILNET_BIND_IP:-100.83.176.60}:5432:5432"
    networks:
      - dokploy-network
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          cpus: "0.01"
          memory: 8M

volumes:
  darkfac-demands:
    name: darkfac-demands-v1
  darkfac-artifacts:
    name: darkfac-artifacts
  darkfac-test-logs:
    name: darkfac-test-logs
  darkfac-codex-auth:
    name: darkfac-codex-auth
  darkfac-workspaces:
    name: darkfac-workspaces
  darkfac-canary-reports-v2:
    name: darkfac-canary-reports-v2

networks:
  dokploy-network:
    external: true
