# ==============================================================================
# DarkHub 24/7 & Webhooks Gateway - Dokploy PaaS Production Compose
# Ticket: USR-18 | INFRA-09 / DF-20 / DF-21
# Target Host: Hetzner CX23 (darkfac-vps-primary / dokploy.ggcampos.com)
# Domain: https://darkhub.ggcampos.com
# ==============================================================================

services:
  darkhub:
    build:
      # The redeploy CLI supplies the full origin/main SHA. An empty SHA must fail the build.
      context: https://${GITHUB_PAT:-}@github.com/GCamposGit/DarkFactory.git#${DARKFAC_GIT_SHA}
      dockerfile: deploy/dokploy/Dockerfile.hub
      no_cache: true
      args:
        DARKFAC_GIT_SHA: ${DARKFAC_GIT_SHA}
    image: darkhub:v2.1
    pull_policy: build
    container_name: darkhub-cloud-247
    # USR-212: hostname fallback for core.infra.metrics.resolve_host_node_id (darkhub-* => VPS)
    hostname: darkhub-cloud-247
    restart: unless-stopped
    # USR-207: Traefik only routes to a healthy container, and a deploy is only "done" once /health answers.
    # Phase 2 (start-first, no container_name) is in docs/proposals/USR-207-zero-downtime.md.
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      - PORT=8000
      # USR-212: node identity of this Hub (the VPS), never the Notebook default
      - DARKFAC_NODE_ID=${DARKFAC_NODE_ID:-darkfac-vps-primary}
      - DARKFAC_GIT_SHA=${DARKFAC_GIT_SHA}
      - DARKHUB_ALLOWED_HOSTS=${DARKHUB_ALLOWED_HOSTS:-localhost,127.0.0.1,darkhub.ggcampos.com,dokploy.ggcampos.com,178.105.73.168,100.83.176.60}
      - GITHUB_PAT=${GITHUB_PAT:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - DOKPLOY_DEPLOY_URL=${DOKPLOY_DEPLOY_URL:-}
      - DARKFAC_TELEMETRY_KEY=${DARKFAC_TELEMETRY_KEY:-}
      # USR-42: read-only view of the coordinator's control store for the task board
      - DARKHUB_CONTROL_DATABASE_URL=${DARKHUB_CONTROL_DATABASE_URL:-}
      # Owner demands -> production line (core.line.owner_intake): Telegram /demand, /linha <ticket>
      # and POST /api/demands/tickets/<id>/line enqueue a run on this Postgres. Needs a role that
      # can INSERT (the read-only dashboard role is not enough); empty falls back to
      # DARKFAC_HF02_DATABASE_URL, then DARKHUB_CONTROL_DATABASE_URL.
      - DARKHUB_LINE_DATABASE_URL=${DARKHUB_LINE_DATABASE_URL:-}
      # true/false; empty = on iff a line database URL is configured.
      - DARKFAC_LINE_AUTOSUBMIT=${DARKFAC_LINE_AUTOSUBMIT:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CLOUDFLARE_ZERO_TRUST_ENABLED=${CLOUDFLARE_ZERO_TRUST_ENABLED:-false}
      - CLOUDFLARE_ZERO_TRUST_AUD=${CLOUDFLARE_ZERO_TRUST_AUD:-}
      - DARKHUB_ENABLE_LOCAL_SERVICE_LAUNCH=${DARKHUB_ENABLE_LOCAL_SERVICE_LAUNCH:-false}
      - DARKHUB_SERVICE_URL_OVERRIDES=${DARKHUB_SERVICE_URL_OVERRIDES:-}
      - DATA_DIR=/app/hub/data
      # USR-232: synced quota/credit snapshots (POST /api/usage/sync) live in the darkhub-hub-data volume
      - DARKHUB_USAGE_SNAPSHOT_DIR=/app/hub/data/usage-snapshots
      - FACTORY_DIR=/app/.factory
      # Integrations (Telegram & n8n Community)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_OPS_BOT_TOKEN=${TELEGRAM_OPS_BOT_TOKEN:-}
      - TELEGRAM_OWNER_BOT_TOKEN=${TELEGRAM_OWNER_BOT_TOKEN:-}
      # USR-395: protected-PR approval by tap (docs/manual/governanca.md); absent => Hub opens an OA instead.
      - TELEGRAM_OWNER_CHAT_ID=${TELEGRAM_OWNER_CHAT_ID:-}
      - OWNER_SIGNING_KEY=${OWNER_SIGNING_KEY:-}
      - GH_APP_ID=${GH_APP_ID:-}
      - GH_APP_INSTALLATION_ID=${GH_APP_INSTALLATION_ID:-}
      - GH_APP_PRIVATE_KEY=${GH_APP_PRIVATE_KEY:-}
      - TELEGRAM_AUTHORIZED_USERS=${TELEGRAM_AUTHORIZED_USERS:-}
      - TELEGRAM_AUTHORIZED_CHATS=${TELEGRAM_AUTHORIZED_CHATS:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      # Hub re-registers both bot webhooks on start, pushing the webhook secret (derived if unset).
      - DARKHUB_TELEGRAM_AUTO_WEBHOOK=${DARKHUB_TELEGRAM_AUTO_WEBHOOK:-true}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - N8N_URL=${N8N_URL:-https://n8n.ggcampos.com}
      - N8N_API_KEY=${N8N_API_KEY:-}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
      - REMOTE_HARNESS_URLS=${REMOTE_HARNESS_URLS:-http://100.78.181.90:8080,http://100.81.84.124:8080}
    volumes:
      - darkhub-factory-data:/app/.factory/webhooks
      - darkhub-hub-data:/app/hub/data
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.darkhub.rule=Host(`darkhub.ggcampos.com`)"
      - "traefik.http.routers.darkhub.entrypoints=websecure"
      - "traefik.http.routers.darkhub.tls.certresolver=letsencrypt"
      - "traefik.http.services.darkhub.loadbalancer.server.port=8000"
    # Bounded container logs (2026-10-06 disk incident): json-file default is unbounded.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

volumes:
  darkhub-factory-data:
    name: darkhub-factory-data
  darkhub-hub-data:
    name: darkhub-hub-data

networks:
  dokploy-network:
    external: true
