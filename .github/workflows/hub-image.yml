name: Hub image (GHCR)

# USR-207: build the Hub image on GitHub (not on the 2 vCPU VPS) and publish it to GHCR.
# Only runs when something the image embeds changes (see core/infra/deploy_classifier.py).
on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "hub/**"
      - "scripts/**"
      - "deploy/**"
      - "docs/**"
      - ".factory/**"
      - "requirements.txt"
      - "harness.config.json"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/dokploy/Dockerfile.hub
          push: true
          build-args: |
            DARKFAC_GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/gcamposgit/darkhub:${{ github.sha }}
            ghcr.io/gcamposgit/darkhub:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
