name: DarkFac CI

on:
  push:
    branches: [main, master]
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# USR-300: cancel superseded runs of the same PR only; never cancel pushes to main.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  trusted-pr-policy:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout candidate merge without executing it
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce base-owned governance policy
        working-directory: candidate
        run: python ../trusted/core/orchestrator/guard.py ${{ github.event.pull_request.base.sha }}

  # USR-300: classify the change set. Governance/code/config changes are always heavy.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.classify.outputs.heavy }}
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce base-owned governance policy
        working-directory: candidate
        run: python ../trusted/core/orchestrator/guard.py ${{ github.event.pull_request.base.sha }}
      - name: Classify changed paths (base-owned script)
        id: classify
        working-directory: candidate
        run: python ../trusted/scripts/ci_paths.py --base ${{ github.event.pull_request.base.sha }} --head ${{ github.event.pull_request.head.sha }}

  # USR-244: fast semantic validation of the ledgers for light (data/docs only) PRs.
  ledger-fast:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.heavy == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate demands and owner-action ledgers
        env:
          DARKFAC_HARNESS_CACHE: "off"
        run: >-
          python -m pytest -q -p no:cacheprovider -n 0
          tests/test_demands.py tests/test_demands_hygiene.py tests/test_demands_merge.py
          tests/test_demand_id_allocator.py tests/test_ledger_hygiene.py
          tests/test_owner_actions_core.py tests/test_owner_actions_conflict_merge.py

  pr-tests:
    name: pr-tests (${{ matrix.os }}${{ matrix.shard && format(' {0}/4', matrix.shard) || '' }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.heavy == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: ""
          - os: windows-latest
            shard: 1
          - os: windows-latest
            shard: 2
          - os: windows-latest
            shard: 3
          - os: windows-latest
            shard: 4
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce base-owned governance policy
        working-directory: candidate
        run: python ../trusted/core/orchestrator/guard.py ${{ github.event.pull_request.base.sha }}
      - name: Materialize base-owned verifier
        working-directory: candidate
        shell: bash
        run: |
          cp -R ../trusted/core/harness/. core/harness/
          cp ../trusted/harness.config.json harness.config.json
          mkdir -p core/testing
          cp ../trusted/core/testing/shards.py core/testing/shards.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        working-directory: candidate
        run: python -m pip install -r requirements.txt
      - name: Run base-owned deterministic harness
        working-directory: candidate
        shell: bash
        env:
          DARKFAC_HARNESS_CACHE: "off"
        run: |
          if [ -n "${{ matrix.shard }}" ]; then
            python core/harness/runner.py --quick --shard "${{ matrix.shard }}/4"
          else
            python core/harness/runner.py --quick
          fi

  # Required-check names kept stable: always-run aggregators (skipped heavy jobs still pass).
  pr-validation-ubuntu:
    name: pr-validation (ubuntu-latest)
    needs: [changes, ledger-fast, pr-tests]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate result
        run: |
          heavy="${{ needs.changes.outputs.heavy }}"
          echo "changes=${{ needs.changes.result }} heavy=$heavy ledger-fast=${{ needs.ledger-fast.result }} pr-tests=${{ needs.pr-tests.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          if [ "$heavy" = "true" ]; then
            [ "${{ needs.pr-tests.result }}" = "success" ] || exit 1
          else
            [ "${{ needs.ledger-fast.result }}" = "success" ] || exit 1
          fi

  pr-validation-windows:
    name: pr-validation (windows-latest)
    needs: [changes, pr-tests]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate result
        run: |
          heavy="${{ needs.changes.outputs.heavy }}"
          echo "changes=${{ needs.changes.result }} heavy=$heavy pr-tests=${{ needs.pr-tests.result }}"
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          if [ "$heavy" = "true" ]; then
            [ "${{ needs.pr-tests.result }}" = "success" ] || exit 1
          fi

  main-tests:
    name: main-tests (${{ matrix.os }}${{ matrix.shard && format(' {0}/4', matrix.shard) || '' }})
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shard: ""
          - os: windows-latest
            shard: 1
          - os: windows-latest
            shard: 2
          - os: windows-latest
            shard: 3
          - os: windows-latest
            shard: 4
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run deterministic harness
        shell: bash
        env:
          DARKFAC_HARNESS_CACHE: "off"
        run: |
          if [ -n "${{ matrix.shard }}" ]; then
            python core/harness/runner.py --quick --shard "${{ matrix.shard }}/4"
          else
            python core/harness/runner.py --quick
          fi

  main-validation:
    needs: main-tests
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate result (all shards must pass)
        run: |
          [ "${{ needs.main-tests.result }}" = "success" ] || { echo "main-tests: ${{ needs.main-tests.result }}"; exit 1; }

  continuous-deployment:
    name: Continuous Deployment (Dokploy)
    needs: main-validation
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy Continuous Deployment Webhook
        env:
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
        run: |
          if [ -n "$DOKPLOY_DEPLOY_URL" ]; then
            echo "Dispatching Dokploy continuous deployment webhook..."
            curl -s -S -X POST "$DOKPLOY_DEPLOY_URL" \
              -H "Content-Type: application/json" \
              -H "User-Agent: DarkFac-CI-Deployer/1.0" \
              -d '{"source": "github_actions", "ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
            echo "Deployment webhook triggered successfully."
          else
            echo "DOKPLOY_DEPLOY_URL secret is not configured in this repository; skipping automated cloud trigger."
          fi

