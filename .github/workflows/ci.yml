name: DarkFac CI

on:
  push:
    branches: [main, master]
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  trusted-pr-policy:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout candidate merge without executing it
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce base-owned governance policy
        working-directory: candidate
        run: python ../trusted/core/orchestrator/guard.py ${{ github.event.pull_request.base.sha }}

  pr-validation:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce base-owned governance policy
        working-directory: candidate
        run: python ../trusted/core/orchestrator/guard.py ${{ github.event.pull_request.base.sha }}
      - name: Materialize base-owned verifier
        working-directory: candidate
        shell: bash
        run: |
          cp -R ../trusted/core/harness/. core/harness/
          cp ../trusted/harness.config.json harness.config.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        working-directory: candidate
        run: python -m pip install -r requirements.txt
      - name: Run base-owned deterministic harness
        working-directory: candidate
        env:
          DARKFAC_HARNESS_CACHE: "off"
        run: python core/harness/runner.py --quick

  main-validation:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run deterministic harness
        env:
          DARKFAC_HARNESS_CACHE: "off"
        run: python core/harness/runner.py --quick

  continuous-deployment:
    name: Continuous Deployment (Dokploy)
    needs: main-validation
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy Continuous Deployment Webhook
        env:
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
        run: |
          if [ -n "$DOKPLOY_DEPLOY_URL" ]; then
            echo "Dispatching Dokploy continuous deployment webhook..."
            curl -s -S -X POST "$DOKPLOY_DEPLOY_URL" \
              -H "Content-Type: application/json" \
              -H "User-Agent: DarkFac-CI-Deployer/1.0" \
              -d '{"source": "github_actions", "ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'
            echo "Deployment webhook triggered successfully."
          else
            echo "DOKPLOY_DEPLOY_URL secret is not configured in this repository; skipping automated cloud trigger."
          fi

