name: DarkFac CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q core hub run_hub.py
      - name: Run deterministic harness
        run: python core/harness/runner.py --quick
      - name: Run shared test suite
        run: python -m pytest tests -v --ignore=tests/test_canaletto.py
